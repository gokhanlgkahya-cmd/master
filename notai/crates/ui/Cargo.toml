[package]
name = "notai-ui"
description = "NotAI arayüzü: Leptos (Rust → WASM); Tauri kabuğunun içinde çalışır"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "notai-ui"
path = "src/main.rs"

[dependencies]
notai-api.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["serde", "std"] }
leptos = { version = "0.8.23", features = ["csr"] }
serde.workspace = true
serde_json.workspace = true
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
urlencoding = "2"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlTextAreaElement", "HtmlInputElement", "Location", "Storage", "File", "FileList", "Blob", "BlobEvent", "BlobPropertyBag", "MediaDevices", "MediaStream", "MediaStreamTrack", "MediaStreamConstraints", "MediaRecorder", "MediaRecorderOptions", "Navigator", "Geolocation", "Position", "Coordinates", "GeolocationPosition", "GeolocationCoordinates", "PositionOptions", "HtmlImageElement", "HtmlCanvasElement", "CanvasRenderingContext2d", "Url"] }

[build-dependencies]
notai-tokens.workspace = true

[lints]
workspace = true
