<style>
*{box-sizing:border-box}
html{background:var(--color-bg)}
body{margin:0;padding:var(--space-6) var(--space-4) var(--space-16);background:var(--color-bg);color:var(--color-text);font:var(--font-weight-regular) var(--font-size-md)/var(--font-line-height-md) var(--font-family-base);overflow-wrap:break-word}
button,input,select{font:inherit;color:inherit;margin:0}
button{cursor:pointer}
p{margin:0}
:is(button,input,select,a,[tabindex]):focus-visible,.is-focus{outline:var(--border-width-focus) solid var(--color-focus-ring);outline-offset:var(--border-width-focus-offset)}
.i{width:var(--icon-size-md);height:var(--icon-size-md);flex:none;stroke:currentColor;fill:none;stroke-width:var(--icon-stroke);stroke-linecap:round;stroke-linejoin:round}
.i-sm{width:var(--icon-size-sm);height:var(--icon-size-sm)}
.i-xs{width:var(--icon-size-xs);height:var(--icon-size-xs)}
.i-lg{width:var(--space-8);height:var(--space-8)}
.is-disabled,[disabled]{opacity:var(--opacity-disabled);cursor:not-allowed}

/* sayfa iskeleti */
.theme-head{display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-4)}
.theme-head h1{margin:0;font-size:var(--font-size-xl);line-height:var(--font-line-height-xl);font-weight:var(--font-weight-bold);letter-spacing:var(--font-letter-spacing-tight)}
.theme-head span{font-size:var(--font-size-sm);line-height:var(--font-line-height-sm);color:var(--color-text-muted)}
.sec{margin-top:var(--space-12)}
.sec>h2{margin:0 0 var(--space-1);font-size:var(--font-size-lg);line-height:var(--font-line-height-lg);font-weight:var(--font-weight-semibold);letter-spacing:var(--font-letter-spacing-tight)}
.note{margin:0 0 var(--space-4);font-size:var(--font-size-sm);line-height:var(--font-line-height-sm);color:var(--color-text-muted)}
.stage{display:grid;gap:var(--space-5)}
.lbl{margin:0 0 var(--space-2);font-size:var(--font-size-xs);line-height:var(--font-line-height-xs);font-weight:var(--font-weight-semibold);color:var(--color-text-muted)}
.demo{width:100%;max-width:var(--size-phone-width)}
.frame{background:var(--color-bg);border:var(--border-width-hairline) solid var(--color-border);border-radius:var(--radius-lg);overflow:hidden}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-3)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(calc(var(--size-phone-width) * 0.72),1fr));gap:var(--space-5)}

/* butonlar */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);min-height:var(--size-touch-min);padding:0 var(--space-5);border-radius:var(--radius-md);border:var(--border-width-hairline) solid transparent;background:transparent;font-size:var(--font-size-md);line-height:var(--font-line-height-md);font-weight:var(--font-weight-semibold);white-space:nowrap;transition:background var(--motion-duration-fast) var(--motion-easing-standard)}
.btn-primary{background:var(--color-accent);color:var(--color-on-accent)}
.btn-primary:active,.btn-primary.is-pressed{background:var(--color-accent-pressed)}
.btn-secondary{background:var(--color-surface);border-color:var(--color-border-strong);color:var(--color-text)}
.btn-secondary:active,.btn-secondary.is-pressed{background:var(--color-chip-bg-pressed)}
.btn-text{padding:0 var(--space-3);color:var(--color-text)}
.btn-text:active,.btn-text.is-pressed{background:var(--color-chip-bg-pressed)}
.btn-danger{background:var(--color-error-bg);border-color:var(--color-error-border);color:var(--color-error)}
.btn-danger:active,.btn-danger.is-pressed{background:var(--color-surface-sunken)}
.btn-block{width:100%}
.ib{display:inline-grid;place-items:center;width:var(--size-touch-min);height:var(--size-touch-min);border:0;border-radius:var(--radius-full);background:transparent;color:var(--color-text);flex:none}
.ib:active,.ib.is-pressed{background:var(--color-chip-bg-pressed)}
.ib-outline{border:var(--border-width-hairline) solid var(--color-border-strong)}
.matrix{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-3) var(--space-2);align-items:center;justify-items:start}
.matrix .lbl{margin:0}

/* sekme çubuğu */
.tabbar{display:flex;height:var(--size-tabbar);background:var(--color-bg);border-top:var(--border-width-hairline) solid var(--color-border)}
.tab{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-1);min-height:var(--size-touch-min);padding:0;border:0;background:none;color:var(--color-tab-idle);font-size:var(--font-size-xs);line-height:var(--font-line-height-xs);font-weight:var(--font-weight-medium)}
.tab .pill{display:grid;place-items:center;width:var(--size-tab-pill-width);height:var(--size-tab-pill-height);border-radius:var(--radius-full);transition:background var(--motion-duration-fast) var(--motion-easing-standard)}
.tab[aria-current="page"]{color:var(--color-tab-active);font-weight:var(--font-weight-bold)}
.tab[aria-current="page"] .pill{background:var(--color-tab-indicator)}
.tab:active .pill,.tab.is-pressed .pill{background:var(--color-chip-bg-pressed)}
.tab:focus-visible,.tab.is-focus{outline-offset:calc(-1 * var(--border-width-focus))}

/* uygulama başlığı */
.appbar{display:flex;align-items:center;gap:var(--space-2);min-height:var(--size-topbar);padding:0 var(--space-2) 0 var(--space-4);background:var(--color-bg)}
.appbar h3{margin:0;flex:1;font-size:var(--font-size-xl);line-height:var(--font-line-height-xl);font-weight:var(--font-weight-bold);letter-spacing:var(--font-letter-spacing-tight)}
.appbar.flow-bar{padding-left:var(--space-1);border-bottom:var(--border-width-hairline) solid var(--color-border)}
.appbar .who{flex:1;min-width:0;display:flex;align-items:center;gap:var(--space-3);background:none;border:0;padding:0;text-align:left;min-height:var(--size-touch-min)}
.appbar .who b{display:block;font-size:var(--font-size-lg);line-height:var(--font-line-height-lg);font-weight:var(--font-weight-semibold);letter-spacing:var(--font-letter-spacing-tight)}
.appbar .who small{display:block;font-size:var(--font-size-xs);line-height:var(--font-line-height-xs);color:var(--color-meta)}
.ticon{display:grid;place-items:center;width:var(--size-topic-icon);height:var(--size-topic-icon);flex:none;border-radius:var(--radius-full);background:var(--color-tile-bg);color:var(--color-text)}

/* bölmeli kontrol */
.seg{display:flex;gap:var(--space-1);padding:var(--space-1);background:var(--color-segment-track);border-radius:var(--radius-md)}
.seg button{flex:1;min-height:var(--size-touch-min);padding:0 var(--space-2);border:var(--border-width-hairline) solid transparent;border-radius:var(--radius-sm);background:transparent;color:var(--color-segment-text);font-size:var(--font-size-sm);line-height:var(--font-line-height-sm);font-weight:var(--font-weight-medium)}
.seg button[aria-pressed="true"]{background:var(--color-segment-thumb);border-color:var(--color-segment-thumb-border);color:var(--color-segment-text-selected);font-weight:var(--font-weight-semibold)}
.seg button:active:not([aria-pressed="true"]),.seg button.is-pressed{background:var(--color-chip-bg-pressed)}

/* rozet ve etiketler */
.badge{display:inline-grid;place-items:center;min-width:var(--space-5);height:var(--space-5);padding:0 var(--space-1);border-radius:var(--radius-full);background:var(--color-badge-bg);color:var(--color-badge-text);font-size:var(--font-size-xs);line-height:var(--font-line-height-xs);font-weight:var(--font-weight-semibold);font-variant-numeric:var(--font-feature-tabular)}
.dot{display:block;width:var(--size-dot);height:var(--size-dot);border-radius:var(--radius-full);background:var(--color-unprocessed-dot)}
.tag{display:inline-flex;align-items:center;gap:var(--space-1);padding:0 var(--space-2);height:var(--space-6);border-radius:var(--radius-full);border:var(--border-width-hairline) solid transparent;font-size:var(--font-size-xs);line-height:var(--font-line-height-xs);font-weight:var(--font-weight-semibold);white-space:nowrap}
.tag-high,.tag-error{background:var(--color-error-bg);color:var(--color-error);border-color:var(--color-error-border)}
.tag-mid,.tag-warning{background:var(--color-warning-bg);color:var(--color-warning);border-color:var(--color-warning-border)}
.tag-low{background:var(--color-tile-bg);color:var(--color-text-muted);border-color:var(--color-border)}
.tag-success{background:var(--color-success-bg);color:var(--color-success);border-color:var(--color-success-border)}
.tag-info{background:var(--color-info-bg);color:var(--color-info);border-color:var(--color-info-border)}
.tag-topic{background:var(--color-tile-bg);color:var(--color-text-muted);padding:0 var(--space-2) 0 var(--space-1)}
.tabdot{position:relative}
.tabdot .badge{position:absolute;top:calc(-1 * var(--space-1));right:calc(-1 * var(--space-2))}

/* konu satırı */
.topics{background:var(--color-bg)}
.trow{display:flex;align-items:center;gap:var(--space-3);width:100%;min-height:calc(var(--size-touch-min) + var(--space-8));padding:var(--space-3) var(--space-4);border:0;background:transparent;text-align:left}
.trow:active,.trow.is-pressed{background:var(--color-chip-bg-pressed)}
.trow .mid{flex:1;min-width:0}
.trow .mid b{display:block;font-size:var(--font-size-md);line-height:var(--font-line-height-md);font-weight:var(--font-weight-semibold)}
.trow .mid span{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:var(--font-size-sm);line-height:var(--font-line-height-sm);color:var(--color-text-muted)}
.trow .end{display:flex;flex-direction:column;align-items:flex-end;gap:var(--space-1);flex:none;font-size:var(--font-size-xs);line-height:var(--font-line-height-xs);color:var(--color-meta);font-variant-numeric:var(--font-feature-tabular)}
.trow .end .pinrow{display:flex;align-items:center;gap:var(--space-1)}
.trow+.trow{border-top:var(--border-width-hairline) solid var(--color-border)}
.trow.weekly .mid span{color:var(--color-meta)}

/* gün ayracı */
.daysep{display:flex;align-items:center;justify-content:center;margin:var(--space-6) 0}
.daysep span{padding:var(--space-1) var(--space-3);border-radius:var(--radius-full);background:var(--color-tile-bg);color:var(--color-text-muted);font-size:var(--font-size-sm);line-height:var(--font-line-height-sm);font-weight:var(--font-weight-semibold)}

/* akış ve kayıt balonu */
.flow{padding:var(--space-2) var(--space-3) var(--space-4)}
.entry{display:grid;grid-template-columns:var(--size-gutter) 1fr;column-gap:var(--space-1);margin-bottom:var(--space-4)}
.entry.tight{margin-bottom:var(--space-2)}
.gut{padding-top:calc(var(--font-line-height-xs) + var(--space-1) + var(--space-2) + (var(--font-line-height-md) - var(--size-dot)) / 2)}
.col{justify-self:end;max-width:calc(var(--size-bubble-max) * 100%);min-width:0;display:flex;flex-direction:column;align-items:flex-end}
.meta{display:flex;align-items:center;gap:var(--space-1);margin-bottom:var(--space-1);font-size:var(--font-size-xs);line-height:var(--font-line-height-xs);color:var(--color-meta);font-variant-numeric:var(--font-feature-tabular)}
.bubble{padding:var(--space-2) var(--space-3);background:var(--color-bubble);color:var(--color-bubble-text);border:var(--border-width-hairline) solid var(--color-bubble-border);border-radius:var(--radius-md);box-shadow:var(--shadow-raised)}
.bubble.is-pressed{background:var(--color-chip-bg-pressed)}
.bubble .photo{display:grid;place-items:center;aspect-ratio:4/3;margin-bottom:var(--space-2);border-radius:var(--radius-sm);background:var(--color-tile-bg);color:var(--color-text-subtle);overflow:hidden}
.bubble .photo svg{width:100%;display:block}
.bubble .cap{font-size:var(--font-size-md);line-height:var(--font-line-height-md)}
.bubble.has-photo{width:calc(var(--size-phone-width) * 0.55)}
.entry .chips{margin-top:var(--space-3)}

/* AI çipi */
.chips{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:var(--space-3) var(--space-2)}
.chip{position:relative;display:inline-flex;align-items:center;height:var(--size-chip);border-radius:var(--radius-full);border:var(--border-width-hairline) var(--border-style-suggested) var(--color-chip-border);background:var(--color-chip-bg);color:var(--color-chip-text);font-size:var(--font-size-sm);line-height:var(--font-line-height-sm);font-weight:var(--font-weight-medium);white-space:nowrap;transition:background var(--motion-duration-fast) var(--motion-easing-standard)}
.chip button{position:relative;display:inline-flex;align-items:center;gap:var(--space-1);height:100%;border:0;background:transparent;color:inherit;font:inherit;padding:0}
.chip button::before{content:"";position:absolute;inset:calc((var(--size-chip) - var(--size-touch-min)) / 2) 0}
.chip .body{padding:0 var(--space-2) 0 var(--space-3);border-radius:var(--radius-full) 0 0 var(--radius-full)}
.chip .x{justify-content:center;width:var(--size-touch-min);margin-left:calc(-1 * var(--space-3));border-radius:0 var(--radius-full) var(--radius-full) 0;color:var(--color-dismiss)}
.chip .x::before{inset:calc((var(--size-chip) - var(--size-touch-min)) / 2) 0}
.chip.is-pressed,.chip:has(.body:active){background:var(--color-chip-bg-pressed)}
.chip.accepted{border-style:var(--border-style-accepted)}
