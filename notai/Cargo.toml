[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/store",
    "crates/ai",
    "crates/server",
    "crates/sync",
    "crates/tokens",
    "crates/api",
    "crates/ui",
    "crates/app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
license = "MIT"
authors = ["Gökhan"]

[workspace.dependencies]
notai-core = { path = "crates/core" }
notai-store = { path = "crates/store" }
notai-ai = { path = "crates/ai" }
notai-sync = { path = "crates/sync" }
notai-tokens = { path = "crates/tokens" }
notai-api = { path = "crates/api" }

chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
chrono-tz = { version = "0.10.4", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
uuid = { version = "1.29.1", features = ["v7", "serde"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time", "sync", "signal", "net"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono", "uuid"] }
axum = "0.8.9"
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls"] }
wiremock = "0.6.5"
tempfile = "3"
base64 = "0.22"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"

# Disk ve derleme süresi: bağımlılıklarda hata ayıklama bilgisi yok, kendi kodumuzda yalnız satır tabloları.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
